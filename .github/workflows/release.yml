name: Release and publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Check release tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$version")" = "$GITHUB_SHA"
          fi
      - run: npm pack
      - name: Publish package and create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish "asciiground-$VERSION.tgz" --provenance --access public --tag beta
            release_flags=(--prerelease --latest=false)
          else
            npm publish "asciiground-$VERSION.tgz" --provenance --access public
            release_flags=(--latest)
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes \
            --title "Release v$VERSION" "${release_flags[@]}" \
            "asciiground-$VERSION.tgz" dist/asciiground.es.js dist/asciiground.cjs dist/asciiground.umd.js

  verify-publication:
    name: Verify package and documentation
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Wait for npm package and dist-tag
        run: node scripts/verify-release.mjs npm "$VERSION"
      - name: Deploy and wait for versioned documentation
        if: ${{ !contains(needs.release.outputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/docs.yml/dispatches" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --field ref=development --field "inputs[version]=$VERSION" --jq '.workflow_run_id')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run watch "$run_id" --exit-status --interval 15
      - name: Verify live documentation
        if: ${{ !contains(needs.release.outputs.version, '-') }}
        run: node scripts/verify-release.mjs docs "$VERSION"
