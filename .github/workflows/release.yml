name: Release and publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Check release tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$version")" = "$GITHUB_SHA"
          fi
      - run: npm pack
      - name: Publish package and create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish "asciiground-$VERSION.tgz" --provenance --access public --tag beta
            release_flags=(--prerelease --latest=false)
          else
            npm publish "asciiground-$VERSION.tgz" --provenance --access public
            release_flags=(--latest)
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes \
            --title "Release v$VERSION" "${release_flags[@]}" \
            "asciiground-$VERSION.tgz" dist/asciiground.es.js dist/asciiground.cjs dist/asciiground.umd.js
      - name: Refresh versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref development
