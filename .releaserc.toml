[tool.changelog]
format = "## [{version}] - {date}"
template = "CHANGELOG.md.j2"

[tool.semver]
major_patterns = ["BREAKING CHANGE:", "feat!:", "fix!:", "perf!:"]
minor_patterns = ["feat:", "feature:"]
patch_patterns = [
    "fix:",
    "bugfix:",
    "patch:",
    "docs:",
    "style:",
    "refactor:",
    "test:",
    "chore:",
]

[tool.release]
exclude_patterns = ["^chore:", "^docs:", "^style:", "Merge "]

[tool.cdn]
base_url = "https://unpkg.com/asciiground"
files = ["asciiground.umd.js", "asciiground.es.js", "index.d.ts"]
